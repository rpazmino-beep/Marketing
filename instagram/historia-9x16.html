<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paz-Pin Historia 9:16</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url('assets/fonts/montserrat.woff2') format('woff2'); }
  @font-face { font-family: 'Kaushan Script'; font-weight: 400; src: url('assets/fonts/kaushan-script.woff2') format('woff2'); }
  :root {
    --navy: #1b2a78;
    --water: #3d7fd6;
    --lime: #8cbf2f;
    --ink: #14204f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; font-family: 'Montserrat', sans-serif; background: #fff; overflow: hidden; }
  .ad { position: relative; width: 1080px; height: 1920px; background: #fff; }

  .top {
    height: 520px; padding: 170px 60px 0;
    background: linear-gradient(135deg, var(--navy) 0%, #24439e 100%);
    color: #fff; position: relative;
  }
  .brand { display: flex; align-items: baseline; gap: 18px; }
  .brand .name { font-family: 'Kaushan Script', cursive; font-size: 64px; line-height: 1; }
  .brand .vip { font-weight: 700; font-size: 30px; color: var(--lime); letter-spacing: 1px; }
  .top h1 { margin-top: 26px; font-weight: 900; font-size: 76px; line-height: 1.05; letter-spacing: -1px; }
  .top h1 span { color: var(--lime); }

  .photo {
    height: 820px;
    background: url('assets/trailer-vip.jpg') center 58% / cover no-repeat;
    position: relative;
  }
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(27,42,120,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 80%, rgba(255,255,255,.9) 100%);
  }
  .tag {
    position: absolute; top: 28px; right: 40px; z-index: 2;
    background: var(--lime); color: var(--ink); font-weight: 800; font-size: 26px;
    padding: 12px 24px; border-radius: 40px; box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }

  .bottom { height: 580px; padding: 30px 60px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; position: relative; }
  .info { flex: 1; }
  .list { list-style: none; }
  .list { display: inline-block; text-align: left; }
  .list li { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; color: var(--ink); margin-bottom: 22px; }
  .list li::before {
    content: '✓'; flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: var(--water); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 900;
  }
  .cta {
    display: inline-flex; flex-direction: column; margin-top: 30px; padding: 26px 60px !important;
    background: var(--navy); color: #fff; border-radius: 22px; padding: 16px 30px;
  }
  .cta b { font-size: 46px; font-weight: 900; }
  .cta small { font-size: 30px; font-weight: 500; color: #cfe0ff; margin-top: 2px; }
  .cabin { position: absolute; right: 50px; top: -340px; width: 240px; height: 310px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 16px; background: url('assets/bano-quimico.jpg') center / contain no-repeat; background-color: #fff; background-origin: content-box; z-index: 5; }
  .zona { position: absolute; left: 60px; top: 432px; display: flex; align-items: center; gap: 12px; }
  .zona div { font-weight: 700; font-size: 32px; }
  .zona small { font-weight: 800; color: var(--lime); letter-spacing: 1px; margin-right: 8px; }
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="brand"><span class="name">Paz - Pin</span><span class="vip">BAÑOS VIP</span></div>
    <h1>Baños a la altura<br>de <span>tu evento</span></h1>
    <div class="zona"><svg viewBox="0 0 24 24" width="40" height="40"><path fill="#8cbf2f" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><div><small>COBERTURA</small>RM · V Región · VI Región</div></div>
  </div>

  <div class="photo"><div class="tag">Tráiler VIP</div></div>

  <div class="bottom">
    <div class="info">
      <ul class="list">
        <li>Tráiler VIP con iluminación LED</li>
        <li>Baños químicos individuales</li>
        <li>Matrimonios, conciertos y faenas</li>
      </ul>
      <div class="cta">
        <b>¡Cotiza hoy!</b>
        <small>www.pazpin.cl</small>
        <small>@pazpin_sanitarios</small>
      </div>
    </div>
    <div class="cabin"></div>
  </div>
</div>
</body>
</html>
