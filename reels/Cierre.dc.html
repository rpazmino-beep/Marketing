<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>

  <style>

    a { color: #8CC63F; } a:hover { color: #A8DB63; }
  </style>
</helmet>

    <div style="font-family: Yellowtail, 'Brush Script MT', cursive; font-size: 112px; line-height: 1;">Paz - Pin</div>
    <div style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: .2em; text-transform: uppercase; color: #8CC63F;">Baños VIP</div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: center; gap: 26px; background: #8CC63F; color: #0E2A18; border-radius: 28px; padding: 24px 28px;">
      <img src="qr-whatsapp.png" alt="Código QR que abre el chat de WhatsApp de Paz-Pin" style="flex-shrink: 0; width: 230px; height: 230px; border-radius: 18px; background: #FFFFFF; display: block;">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="#0E2A18"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.94.53 3.75 1.45 5.3L2 22.4l5.4-1.6a9.8 9.8 0 0 0 4.64 1.18h.01c5.43 0 9.84-4.4 9.84-9.84C21.89 6.4 17.48 2 12.04 2zm5.72 13.9c-.24.68-1.4 1.3-1.94 1.35-.5.05-.98.23-3.3-.7-2.78-1.1-4.55-3.94-4.69-4.12-.14-.19-1.13-1.5-1.13-2.87 0-1.36.71-2.03.97-2.3.25-.28.55-.35.73-.35.18 0 .37 0 .53.01.17.01.4-.06.62.48.24.57.8 1.96.87 2.1.07.14.12.3.02.49-.09.19-.14.3-.28.47-.14.16-.3.36-.42.48-.14.14-.29.29-.13.57.17.28.74 1.22 1.58 1.98 1.09.97 2 1.27 2.29 1.41.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.28.37-.24.62-.14.25.09 1.63.77 1.91.91.28.14.47.21.53.32.07.12.07.66-.17 1.34z"/></svg>

        <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 42px;">+56 9 6168 8931</span>
        <span style="font-size: 24px; font-weight: 500; opacity: .8;">Escanea el código y escríbenos</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 24px; border: 3px solid rgba(244,248,251,.35); border-radius: 24px; padding: 24px 32px;">
      <svg style="flex-shrink: 0;" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#F4F8FB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="#F4F8FB" stroke="none"/></svg>
      <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 40px;">[@TU_USUARIO]</span>
    </div>

    <div style="display: flex; align-items: center; gap: 24px; border: 3px solid rgba(244,248,251,.35); border-radius: 24px; padding: 24px 32px;">
      <svg style="flex-shrink: 0;" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#F4F8FB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>
      <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 36px;">administracion@pazpin.cl</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 6px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span style="font-size: 32px; font-weight: 500; color: #BBD7EC;">Región Metropolitana y alrededores</span>
    </div>

  </div>

  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
