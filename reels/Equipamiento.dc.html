<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
    .ph { background-color: #0B2144; background-image: repeating-linear-gradient(45deg, rgba(63,169,220,.12) 0 22px, rgba(63,169,220,0) 22px 44px); }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #071634; color: #F4F8FB; display: flex; flex-direction: column;">

  <div style="display: flex; gap: 10px; height: 760px;">
    <div class="ph" style="position: relative; width: 630px; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: .55; text-align: center; padding: 0 24px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h6.9l1.3 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
      <div style="font-size: 25px; letter-spacing: .18em; text-transform: uppercase; color: #3FA9DC;">Foto 04</div>
      <div style="font-size: 23px; color: #9DC4E4; line-height: 1.4;">Lavamanos: cubierta de mármol,<br>grifería cromada y detalles</div>
    </div>
    </div>
    <div class="ph" style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: .55; text-align: center; padding: 0 24px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h6.9l1.3 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
      <div style="font-size: 25px; letter-spacing: .18em; text-transform: uppercase; color: #3FA9DC;">Foto 05</div>
      <div style="font-size: 23px; color: #9DC4E4; line-height: 1.4;">Interior: WC y<br>piso flotante</div>
    </div>
    </div>
  </div>

  <div style="padding: 40px 84px 0; display: flex; flex-direction: column; gap: 52px;">

    <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 82px; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase;">Adentro se<br>siente <span style="color: #3FA9DC;">distinto</span></h2>

    <div style="display: flex; flex-direction: column; gap: 40px;">

      <div style="display: flex; align-items: center; gap: 34px;">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c3.6 4.3 6 7.6 6 10.4a6 6 0 0 1-12 0c0-2.8 2.4-6.1 6-10.4z"/></svg>
        <span style="font-size: 46px; font-weight: 500;">Agua corriente y lavamanos</span>
      </div>

      <div style="display: flex; align-items: center; gap: 34px;">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6 6 0 0 0-3.4 10.9c.6.4 1 1.1 1 1.9V18h4.8v-2.7c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 2.5z"/></svg>
        <span style="font-size: 46px; font-weight: 500;">Iluminación LED interior</span>
      </div>

      <div style="display: flex; align-items: center; gap: 34px;">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 18h7"/></svg>
        <span style="font-size: 46px; font-weight: 500;">Ventilación y espejo</span>
      </div>

      <div style="display: flex; align-items: center; gap: 34px;">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#8CC63F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M2.5 20v-1.5A4.5 4.5 0 0 1 7 14h2a4.5 4.5 0 0 1 4.5 4.5V20"/><circle cx="17.5" cy="7.5" r="2.5"/><path d="M16 14h1.5a4 4 0 0 1 4 4V20"/></svg>
        <span style="font-size: 46px; font-weight: 500;">Unidades separadas damas y varones</span>
      </div>

    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
