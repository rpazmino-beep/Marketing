<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0B2144; color: #F4F8FB;">

  <img src="trailer-noche.jpg" alt="Tráiler Paz-Pin de noche con iluminación LED azul" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 1300px; background: linear-gradient(to top, #071634 0%, rgba(7,22,52,.97) 32%, rgba(7,22,52,.85) 56%, rgba(7,22,52,.50) 78%, rgba(7,22,52,0) 100%);"></div>

  <div style="position: absolute; left: 84px; right: 84px; bottom: 470px; display: flex; flex-direction: column; gap: 40px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 64px; height: 5px; background: #8CC63F; border-radius: 3px;"></span>
      <span style="font-size: 30px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: #8CC63F;">Baños VIP para eventos</span>
    </div>
    <h1 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 118px; line-height: 0.96; letter-spacing: -0.03em; text-transform: uppercase; text-wrap: balance;">
      Tu evento<br>merece algo<br><span style="color: #8CC63F;">mejor</span> que un<br>baño químico
    </h1>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 20px; top: 262px; font-size: 22px; color: #8CC63F; letter-spacing: .12em;">ZONA SEGURA ↓</div>
      <div style="position: absolute; left: 20px; bottom: 380px; font-size: 22px; color: #8CC63F; letter-spacing: .12em;">↑ ZONA SEGURA</div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
