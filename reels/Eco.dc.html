<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

    a { color: #12356B; } a:hover { color: #3FA9DC; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F4F8FB; color: #12356B;">

  <svg style="position: absolute; left: -260px; bottom: -180px;" width="820" height="820" viewBox="0 0 100 100" fill="none" stroke="#8CC63F" stroke-width="1.4" opacity="0.38">
    <path d="M18 84C18 46 44 20 84 16c4 40-22 66-60 68z"/>
    <path d="M84 16C60 40 40 60 22 82"/>
  </svg>
  <svg style="position: absolute; right: -160px; top: 300px;" width="640" height="640" viewBox="0 0 900 900" fill="none" stroke="#3FA9DC" stroke-width="2.5" opacity="0.35">
    <ellipse cx="450" cy="450" rx="180" ry="62"/><ellipse cx="450" cy="450" rx="300" ry="104"/><ellipse cx="450" cy="450" rx="420" ry="146"/>
  </svg>

  <div style="position: absolute; left: 84px; right: 84px; top: 300px; display: flex; flex-direction: column; gap: 64px;">

    <div style="display: flex; align-items: center; gap: 40px;">
      <div style="flex-shrink: 0; width: 260px; height: 260px; border-radius: 999px; background: #8CC63F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #0E2A18;">
        <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#0E2A18" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20C4.5 11 10.7 4.8 20 4c1 9.3-5.2 15.5-14.2 16z"/><path d="M20 4C14.3 9.7 9.5 14.5 5.2 19.3"/></svg>
        <div style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 46px; letter-spacing: .1em;">ECO</div>
        <div style="font-size: 24px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;">100% autónomo</div>
      </div>
      <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 78px; line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase;">Lujo con<br>huella<br><span style="color: #8CC63F;">mínima</span></h2>
    </div>

    <div style="display: flex; flex-direction: column; gap: 34px;">

      <div style="display: flex; align-items: flex-start; gap: 30px; border-top: 3px solid rgba(18,53,107,.16); padding-top: 34px;">
        <svg style="flex-shrink: 0; margin-top: 6px;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20V9l5-4 5 4v11"/><path d="M3 4l18 16"/></svg>
        <span style="font-size: 44px; font-weight: 500; line-height: 1.25;">Sin conexión a alcantarillado</span>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 30px; border-top: 3px solid rgba(18,53,107,.16); padding-top: 34px;">
        <svg style="flex-shrink: 0; margin-top: 6px;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c3.6 4.3 6 7.6 6 10.4a6 6 0 0 1-12 0c0-2.8 2.4-6.1 6-10.4z"/><path d="M9 13.5h6"/></svg>

      </div>

      <div style="display: flex; align-items: flex-start; gap: 30px; border-top: 3px solid rgba(18,53,107,.16); padding-top: 34px;">
        <svg style="flex-shrink: 0; margin-top: 6px;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20C4.5 11 10.7 4.8 20 4c1 9.3-5.2 15.5-14.2 16z"/><path d="M20 4C14.3 9.7 9.5 14.5 5.2 19.3"/></svg>
        <span style="font-size: 44px; font-weight: 500; line-height: 1.25;">Insumos biodegradables</span>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 30px; border-top: 3px solid rgba(18,53,107,.16); padding-top: 34px;">
        <svg style="flex-shrink: 0; margin-top: 6px;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5.5 9.5 2l2.5 3.5"/><path d="M9.5 2v7"/><path d="M18.5 12.5 21 16l-4.2.6"/><path d="M5.5 12.5 3 16l4.2.6"/><path d="M8 21h8"/><circle cx="12" cy="14" r="5.5"/></svg>
        <span style="font-size: 44px; font-weight: 500; line-height: 1.25;">Retiro y disposición responsable de residuos</span>
      </div>

    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(63,169,220,.85);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(63,169,220,.85);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
