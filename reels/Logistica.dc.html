<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #071634; color: #F4F8FB;">

  <svg style="position: absolute; left: 50%; top: 1120px; transform: translateX(-50%);" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" stroke="#3FA9DC" stroke-width="2.5" opacity="0.20">
    <ellipse cx="800" cy="500" rx="240" ry="83"/>
    <ellipse cx="800" cy="500" rx="420" ry="146"/>
    <ellipse cx="800" cy="500" rx="600" ry="208"/>
    <ellipse cx="800" cy="500" rx="780" ry="271"/>
  </svg>

  <div style="position: absolute; inset: 0; padding: 300px 84px 420px; display: flex; flex-direction: column; gap: 62px; box-sizing: border-box;">

    <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 106px; line-height: 0.96; letter-spacing: -0.03em; text-transform: uppercase;">Llegamos,<br>instalamos y<br>nos llevamos<br><span style="color: #8CC63F;">todo</span></h2>

    <div style="display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; align-items: center; gap: 30px; border: 3px solid rgba(244,248,251,.28); border-radius: 26px; padding: 30px 36px;">
        <span style="flex-shrink: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 52px; color: #8CC63F;">01</span>
        <svg style="flex-shrink: 0;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 15h4"/></svg>
        <span style="font-size: 42px; font-weight: 500; line-height: 1.2;">Coordinamos la fecha</span>
      </div>

      <div style="display: flex; align-items: center; gap: 30px; border: 3px solid rgba(244,248,251,.28); border-radius: 26px; padding: 30px 36px;">
        <span style="flex-shrink: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 52px; color: #8CC63F;">02</span>
        <svg style="flex-shrink: 0;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5a4.5 4.5 0 0 0-5.9 5.6L3.4 14.3a2 2 0 0 0 0 2.9l3.4 3.4a2 2 0 0 0 2.9 0l5.2-5.2a4.5 4.5 0 0 0 5.6-5.9L17.8 12l-2.6-.6-.6-2.6z"/></svg>
        <span style="font-size: 42px; font-weight: 500; line-height: 1.2;">Instalamos y dejamos operativo</span>
      </div>

      <div style="display: flex; align-items: center; gap: 30px; border: 3px solid rgba(244,248,251,.28); border-radius: 26px; padding: 30px 36px;">
        <span style="flex-shrink: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 52px; color: #8CC63F;">03</span>
        <svg style="flex-shrink: 0;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5h11v9H2z"/><path d="M13 10.5h4.2l2.8 3.2v2.8h-7z"/><circle cx="7" cy="18.5" r="1.9"/><circle cx="16.5" cy="18.5" r="1.9"/></svg>
        <span style="font-size: 42px; font-weight: 500; line-height: 1.2;">Retiramos sin dejar rastro</span>
      </div>

    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
