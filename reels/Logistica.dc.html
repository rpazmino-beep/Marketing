<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
    .ph { background-color: #0B2144; background-image: repeating-linear-gradient(45deg, rgba(63,169,220,.12) 0 22px, rgba(63,169,220,0) 22px 44px); }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #071634; color: #F4F8FB;">

  <div class="ph" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: .55;">
      <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h6.9l1.3 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
      <div style="font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: #3FA9DC;">Foto 05</div>
      <div style="font-size: 25px; color: #9DC4E4; text-align: center; max-width: 640px; line-height: 1.45;">Tráiler enganchado a la camioneta, listo para trasladar</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 1100px; background: linear-gradient(to top, #071634 8%, rgba(7,22,52,.9) 42%, rgba(7,22,52,0) 100%);"></div>

  <div style="position: absolute; left: 84px; right: 84px; bottom: 470px; display: flex; flex-direction: column; gap: 52px;">
    <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 100px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase;">Llegamos,<br>instalamos y<br>nos llevamos<br><span style="color: #8CC63F;">todo</span></h2>

    <div style="display: flex; gap: 20px;">
      <div style="flex-grow: 1; border: 3px solid rgba(244,248,251,.28); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 34px; color: #3FA9DC;">01</span>
        <span style="font-size: 32px; font-weight: 500; line-height: 1.25;">Coordinamos la fecha</span>
      </div>
      <div style="flex-grow: 1; border: 3px solid rgba(244,248,251,.28); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 34px; color: #3FA9DC;">02</span>
        <span style="font-size: 32px; font-weight: 500; line-height: 1.25;">Instalamos y dejamos operativo</span>
      </div>
      <div style="flex-grow: 1; border: 3px solid rgba(244,248,251,.28); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 34px; color: #3FA9DC;">03</span>
        <span style="font-size: 32px; font-weight: 500; line-height: 1.25;">Retiramos sin dejar rastro</span>
      </div>
    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
