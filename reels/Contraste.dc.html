<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
    .ph-dark { background-color: #1E2732; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 22px, rgba(255,255,255,0) 22px 44px); }
    .ph-blue { background-color: #0B2144; background-image: repeating-linear-gradient(45deg, rgba(63,169,220,.12) 0 22px, rgba(63,169,220,0) 22px 44px); }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #071634; color: #F4F8FB; display: flex; flex-direction: column;">

  <div class="ph-dark" style="position: relative; height: 800px; display: flex; align-items: center; justify-content: center; filter: saturate(.25);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: .5;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#9AA6B4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h6.9l1.3 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
      <div style="font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: #9AA6B4;">Foto 02</div>
      <div style="font-size: 25px; color: #7D8896; text-align: center; max-width: 560px; line-height: 1.45;">Baño químico azul básico</div>
    </div>
    <div style="position: absolute; left: 84px; top: 300px; font-family: Sora, Archivo, sans-serif; font-weight: 600; font-size: 64px; color: #B7C0CB;">Esto…</div>
  </div>

  <div style="height: 26px; background: #8CC63F;"></div>

  <div class="ph-blue" style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: .55;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#3FA9DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h6.9l1.3 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
      <div style="font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: #3FA9DC;">Foto 03</div>
      <div style="font-size: 25px; color: #9DC4E4; text-align: center; max-width: 640px; line-height: 1.45;">Tráiler Paz-Pin de día, plano lateral completo</div>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: linear-gradient(to top, #071634 12%, rgba(7,22,52,.75) 52%, rgba(7,22,52,0) 100%);"></div>

    <div style="position: absolute; left: 84px; right: 84px; bottom: 470px; display: flex; flex-direction: column; gap: 26px;">
      <div style="font-family: Sora, Archivo, sans-serif; font-weight: 600; font-size: 64px; color: #8CC63F;">…o esto.</div>
      <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 96px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase;">La misma<br>necesidad,<br>otra categoría</h2>
    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
