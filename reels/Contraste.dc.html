<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
    a { color: #8CC63F; } a:hover { color: #A8DB63; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #071634; color: #F4F8FB;">

  <div style="position: absolute; inset: 0; padding: 260px 0 420px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; gap: 34px; padding: 0 84px;">
      <div style="flex-shrink: 0; width: 300px; height: 300px; background: #1B222C; display: flex; align-items: center; justify-content: center;">
        <svg width="150" height="220" viewBox="0 0 100 148" fill="none">
          <path d="M12 26 L50 8 L88 26 Z" fill="#39424E"/>
          <rect x="16" y="26" width="68" height="112" fill="#2E3742"/>
          <rect x="24" y="40" width="52" height="98" fill="#39424E"/>
          <rect x="32" y="48" width="36" height="4" rx="2" fill="#4C5764"/>
          <rect x="32" y="57" width="36" height="4" rx="2" fill="#4C5764"/>
          <rect x="32" y="66" width="36" height="4" rx="2" fill="#4C5764"/>
          <circle cx="68" cy="92" r="4" fill="#5D6875"/>
          <rect x="12" y="138" width="76" height="6" rx="2" fill="#4C5764"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span style="font-family: Sora, Archivo, sans-serif; font-weight: 600; font-size: 62px; color: #B7C0CB;">Esto…</span>
        <span style="font-size: 32px; font-weight: 500; color: #7D8896; line-height: 1.35;">El baño químico de siempre.<br>Lo que tus invitados esperan.</span>
      </div>
    </div>

    <div style="height: 6px; background: #8CC63F;"></div>

    <img src="trailer-evento.jpg" alt="Tráiler Paz-Pin instalado en un evento con público" style="width: 100%; height: 560px; object-fit: cover; display: block;">

    <div style="height: 6px; background: #8CC63F;"></div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 0 84px;">
      <span style="font-family: Sora, Archivo, sans-serif; font-weight: 600; font-size: 62px; color: #8CC63F;">…o esto.</span>
      <h2 style="margin: 0; font-family: Sora, Archivo, sans-serif; font-weight: 800; font-size: 74px; line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase;">La misma necesidad,<br>otra categoría</h2>
    </div>

  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 0; right: 0; top: 250px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 420px; border-top: 2px dashed rgba(140,198,63,.75);"></div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"guides":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { guides: this.props.guides ?? false };
  }
}
</script>
</body>
</html>
